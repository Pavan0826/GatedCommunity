spring.application.name=Gated

# MySQL profile configuration - activate with profile 'mysql'
# Example: set SPRING_PROFILES_ACTIVE=mysql && .\mvnw.cmd spring-boot:run
#
# NOTE:
# 1) Create the database before starting the app (example commands below).
#    In MySQL Workbench run: CREATE DATABASE IF NOT EXISTS gated_community;
# 2) Adjust username/password below to match your MySQL server credentials.
# 3) The JDBC URL includes common options to avoid timezone/SSL issues.

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Add recommended parameters: disable SSL (for local dev), set serverTimezone,
# and allow public key retrieval if using the default MySQL auth plugin.
spring.datasource.url=jdbc:mysql://localhost:3306/gated_community
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

